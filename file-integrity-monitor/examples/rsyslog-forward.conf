# /etc/rsyslog.d/50-fim-forward.conf
# Forward FIM events (tag "fim", facility log audit) to the central collector over TCP so that
# alerts exist off-host even if this machine is later compromised. Wrap in TLS (gtls driver or
# stunnel) for production; plain TCP is shown for brevity.
if ($syslogtag startswith 'fim' or $programname == 'fim') then {
    action(type="omfwd" target="siem.example.internal" port="514" protocol="tcp"
           queue.type="LinkedList" queue.filename="fim_fwd" queue.maxdiskspace="256m"
           queue.saveonshutdown="on" action.resumeRetryCount="-1")
}
