[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fim-tool"
version = "0.1.0"
description = "File Integrity Monitoring: trusted baselines, change detection and evidence-backed alerts for Linux."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Joseph Mark Ochieng" }]
keywords = ["fim", "file-integrity", "security", "detection", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
signing = ["cryptography>=42"]
watch = ["watchdog>=4"]
all = ["cryptography>=42", "watchdog>=4"]

[project.scripts]
fim = "fim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "cryptography>=42",
  "watchdog>=4",
  "jsonschema>=4",
  "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "watcher: needs the optional watchdog library and a working inotify",
  "shell: runs bats/ShellCheck tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018", "PT011", "PT012", "SIM117", "B018", "RUF012", "RUF005", "E741", "PT006", "PT007", "S101", "B017", "RUF059", "C408"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/fim"]

[[tool.mypy.overrides]]
module = ["watchdog.*"]
ignore_missing_imports = true
