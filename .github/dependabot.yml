# Dependabot: keep the hash-pinned Python dependencies and the SHA-pinned GitHub Actions current.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/file-integrity-monitor"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
