name: linux-ir-tests

on:
  push:
    paths: ["incident-response-toolkit/linux/**", ".github/workflows/linux-ir-tests.yml"]
  pull_request:
    paths: ["incident-response-toolkit/linux/**", ".github/workflows/linux-ir-tests.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: incident-response-toolkit/linux

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy src
      - run: pytest -q
      - name: Validate rules, config and synthetic manifests
        run: |
          python -m linux_ir --config configs/default.yaml info > /dev/null
          python -m linux_ir verify-manifest --input examples/synthetic-evidence/case-001
          python -m linux_ir verify-manifest --input examples/synthetic-evidence/baseline
      - name: CLI smoke tests
        run: |
          python -m linux_ir --help > /dev/null
          python -m linux_ir doctor || true
          python -m linux_ir collect --dry-run --profile extended --output "$RUNNER_TEMP/ev"
          bash scripts/run-demo.sh
      - name: Packaging check
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -m linux_ir --version

  portable-analysis:
    name: analysis tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Parser, IOC, detection and config tests (no live collection)
        run: python -m pytest -q tests/unit/test_parsers.py tests/unit/test_ioc.py tests/unit/test_detections.py tests/unit/test_config_platform.py
