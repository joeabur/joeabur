name: macos-ir-security

on:
  push:
    paths: ["incident-response-toolkit/macos/**", ".github/workflows/macos-ir-security.yml"]
  pull_request:
    paths: ["incident-response-toolkit/macos/**", ".github/workflows/macos-ir-security.yml"]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-response-toolkit/macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Audit runtime and pinned dev dependencies
        run: pip-audit -r requirements/constraints.txt
      - name: Static security checks (ruff flake8-bandit rules)
        run: python -m pip install -c requirements/constraints.txt ruff && ruff check --select S --ignore S108,S603 src

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
