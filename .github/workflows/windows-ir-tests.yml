name: windows-ir-tests

on:
  push:
    paths: ["incident-response-toolkit/windows/**", ".github/workflows/windows-ir-tests.yml"]
  pull_request:
    paths: ["incident-response-toolkit/windows/**", ".github/workflows/windows-ir-tests.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: incident-response-toolkit/windows

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./src, ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize
          if (@($r | Where-Object Severity -in 'Error', 'Warning').Count -gt 0) { exit 1 }

  test:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }   # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }         # PowerShell 7
          - { os: ubuntu-latest, shell: pwsh }          # portable unit tests only (live tests skip)
          - { os: macos-latest, shell: pwsh }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Pester 5
        shell: ${{ matrix.shell }}
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Unit and integration tests
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/Unit', './tests/Integration'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Reproducible synthetic demo
        shell: ${{ matrix.shell }}
        run: ./scripts/Invoke-Demo.ps1
