[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-ir-toolkit"
version = "0.1.0"
description = "Read-only Linux incident response collection, IOC matching, detections and reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.6,<1", "mypy>=1.10,<2", "types-PyYAML", "build", "pip-audit"]

[project.scripts]
linux-ir = "linux_ir.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["linux_only: needs a real Linux host (skipped elsewhere)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S108", "S101", "S603", "S607", "S110", "S112", "SIM105", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
