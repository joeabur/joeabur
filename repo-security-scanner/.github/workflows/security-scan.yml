# Dogfooding: scan this project's own source with reposcan and publish SARIF.
# Uses `pull_request` (never `pull_request_target`) so untrusted fork code runs with a read-only
# token and no secrets. SARIF upload needs security-events: write, so it is skipped for forks.
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, picks up new advisories

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install reposcan and pinned scanners
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --frozen
          uv pip install "semgrep==1.181.0"
          GOBIN="${RUNNER_TEMP}/bin" go install \
            -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" \
            github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Secret scan of the whole tree (synthetic fixtures are allow-listed by policies/selfscan.toml)
        run: |
          reposcan scan . \
            --config policies/selfscan.toml \
            --scanners gitleaks \
            --fail-on high \
            --output-dir "${RUNNER_TEMP}/reposcan/secrets" \
            --format json,sarif,md \
            --github-annotations --github-summary
      - name: SAST of the package source (the demo fixtures are intentionally vulnerable)
        if: ${{ always() }}
        run: |
          reposcan scan src \
            --scanners semgrep \
            --fail-on high \
            --output-dir "${RUNNER_TEMP}/reposcan/sast" \
            --format json,sarif,md \
            --github-annotations --github-summary
      - name: Upload SARIF to code scanning
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/reposcan/reposcan.sarif
      - name: Upload redacted reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reposcan-reports
          path: ${{ runner.temp }}/reposcan/
          retention-days: 14
          if-no-files-found: ignore
