# Continuous integration for reposcan itself.
# Least privilege: the default token is read-only; no job needs anything else.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies from the lockfile
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --extra dev
      - name: Ruff (lint)
        run: uv run --frozen ruff check .
      - name: Ruff (format)
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy
      - name: Report schema is up to date
        run: uv run --frozen python scripts/generate_schema.py --check
      - name: Unit tests, documentation checks and coverage
        run: uv run --frozen pytest --cov=reposcan --cov-report=term-missing --cov-fail-under=85

  integration:
    # Real Gitleaks + Semgrep against the bundled intentionally vulnerable fixtures. No network is
    # needed by the tests themselves; the scanners are installed at the exact tested versions.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install reposcan and pinned scanners
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen --extra dev
          uv pip install "semgrep==1.181.0"
          GOBIN="${RUNNER_TEMP}/bin" go install \
            -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" \
            github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Scanner versions
        run: reposcan doctor --all || true
      - name: Integration tests (offline scanners)
        run: uv run --frozen pytest -m integration

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Audit locked dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}" pip-audit
          uv export --frozen --no-hashes --no-emit-project --extra dev > "${RUNNER_TEMP}/requirements.txt"
          pip-audit -r "${RUNNER_TEMP}/requirements.txt" --no-deps --disable-pip --strict

  workflow-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action is pinned to a full commit SHA
        run: python3 scripts/check_workflows.py .github/workflows
