[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reposcan"
version = "0.1.0"
description = "Security scanner orchestrator: Gitleaks, Semgrep, Trivy and OSV-Scanner with unified findings, baselines and CI policies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "reposcan contributors" }]
keywords = ["security", "sast", "secrets", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.22",
    "pip-audit>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
reposcan = "reposcan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reposcan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "integration: invokes real installed scanners (opt in with -m integration)",
]

[tool.ruff]
# sample-data holds intentionally insecure code; fixtures are captured tool output.
extend-exclude = ["sample-data", "tests/fixtures", ".venv"]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "PT018", "E501", "RUF001", "RUF003", "PT011", "PT012", "SIM117", "B018", "RUF012"]
"scripts/**" = ["S603", "S607"]
"src/reposcan/runner.py" = ["S603"]
"src/reposcan/reporting/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/reposcan"]
